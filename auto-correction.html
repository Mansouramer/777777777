<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بنك أسئلة نافس للعلوم والتصحيح الآلي السريع - مدرسة داوود</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eff6ff; color: #1e3a8a; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 20px; margin-bottom: 15px; }
        .btn-primary { background: #047857; color: white; font-weight: bold; padding: 10px 15px; border-radius: 8px; border: none; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-primary:hover { opacity: 0.9; }
        select, input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 5px; margin-bottom: 12px; font-size: 14px; }
        
        /* تنسيق الخيارات بجوار بعضها (شبكة من زرين بجوار بعض) للتصحيح السريع */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .option-label {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 12px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: right;
        }
        .option-label:hover {
            background: #ecfdf5;
            border-color: #059669;
        }
        .option-label input[type="radio"] {
            width: 18px;
            height: 18px;
            margin: 0;
            cursor: pointer;
        }
        .badge-nafs { background: #d1fae5; color: #065f46; font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: bold; display: inline-block; margin-bottom: 6px; }
    </style>
</head>
<body>

    <div class="max-w-2xl mx-auto">
        <!-- رأس الصفحة -->
        <div class="card text-center bg-gradient-to-r from-emerald-900 to-emerald-700 text-white">
            <h1 class="text-xl font-bold mb-2">⚡ التصحيح الآلي السريع - مادة العلوم (نافس)</h1>
            <p class="text-sm opacity-90">خيارات متجاورة لتسريع عملية الرصد والاختبار لكل طالب</p>
            <a href="index.html" class="inline-block mt-3 bg-white text-emerald-900 px-4 py-1.5 rounded-full text-xs font-bold shadow">🏠 العودة للوحة التحكم الرئيسية</a>
        </div>

        <!-- إعدادات الطالب والاختبار -->
        <div class="card" id="setupCard">
            <h3 class="font-bold text-emerald-900 mb-3">📌 إعدادات اختبار الطالب</h3>
            
            <label class="text-xs font-bold text-gray-600">اسم الطالب:</label>
            <input type="text" id="studentExamName" placeholder="اكتب اسم الطالب هنا...">

            <label class="text-xs font-bold text-gray-600">الصف الدراسي:</label>
            <select id="autoGradeSelect" onchange="updateChaptersList()">
                <option value="الأول الابتدائي">الصف الأول الابتدائي</option>
                <option value="الثاني الابتدائي">الصف الثاني الابتدائي</option>
                <option value="الثالث الابتدائي">الصف الثالث الابتدائي</option>
                <option value="الرابع الابتدائي">الصف الرابع الابتدائي</option>
                <option value="الخامس الابتدائي">الصف الخامس الابتدائي</option>
                <option value="السادس الابتدائي">الصف السادس الابتدائي (المستهدف لنافس)</option>
            </select>

            <label class="text-xs font-bold text-gray-600">وحدة / فصل مادة العلوم:</label>
            <select id="autoChapterSelect">
                <!-- تعبئة تفاعلية حصرية للفصل المختار مادة العلوم فقط -->
            </select>

            <button class="btn-primary mt-2" onclick="startInteractiveQuiz()">🚀 بدء التصحيح السريع</button>
        </div>

        <!-- منطقة العرض التفاعلي سؤال بسؤال (بأزرار متجاورة) -->
        <div class="card" id="interactiveQuizCard" style="display: none;">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <span id="studentDisplayBadge" class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-1 rounded">الطالب: -</span>
                <span id="progressIndicator" class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded">السؤال 1 من 5</span>
            </div>
            
            <div id="singleQuestionContainer">
                <!-- يتم حقن السؤال والخيارات المتجاورة هنا -->
            </div>

            <button id="nextQuestionBtn" class="btn-primary mt-6" onclick="handleNextQuestion()" style="display: none;">التالي ◀</button>
        </div>

        <!-- نتيجة الطالب وزر الانتقال للطالب الثاني -->
        <div class="card text-center" id="resultCard" style="display: none; background: #ecfdf5; border: 2px solid #10b981;">
            <h3 class="font-bold text-emerald-800 text-lg mb-2">🏆 نتيجة اختبار الطالب</h3>
            <p id="studentResultName" class="font-bold text-gray-800 mb-1"></p>
            <p id="finalScoreText" class="text-3xl font-bold text-emerald-700 mb-2">0 / 0</p>
            <p id="feedbackText" class="text-sm text-gray-700 mb-4"></p>
            
            <button class="btn-primary bg-blue-600 mb-2" onclick="resetForNextStudent()">👤 الانتقال للطالب الثاني</button>
            <a href="index.html" class="block text-center text-xs text-gray-500 underline mt-2">إنهاء والعودة للوحة الرئيسية</a>
        </div>
    </div>

    <script>
        const scienceCurriculumChapters = {
            "الأول الابتدائي": ["الوحدة 1: النباتات من حولنا", "الوحدة 2: الحيوانات من حولنا", "الوحدة 3: أرضنا ومواردها", "الوحدة 4: الطقس والفصول"],
            "الثاني الابتدائي": ["الوحدة 1: النباتات والحيوانات", "الوحدة 2: موائل الكائنات الحية", "الوحدة 3: المادة من حولنا", "الوحدة 4: الطاقة والقوى"],
            "الثالث الابتدائي": ["الوحدة 1: الوراثة والبيئة", "الوحدة 2: الأرض ومواردها", "الوحدة 3: المخلوقات الحية تنمو وتتغير", "الوحدة 4: الطاقة والكهرباء والمغناطيسية"],
            "الرابع الابتدائي": ["الوحدة 1: ممالك المخلوقات الحية", "الوحدة 2: المملكة الحيوانية", "الوحدة 3: الأنظمة البيئية", "الوحدة 4: الأمراض والعدوى", "الوحدة 5: التغذية والصحة", "الوحدة 6: المادة والقوى والطاقة"],
            "الخامس الابتدائي": ["الوحدة 1: ممالك المخلوقات الحية", "الوحدة 2: الآباء والأبناء", "الوحدة 3: الأنظمة البيئية", "الوحدة 4: أرضنا المتغيرة", "الوحدة 5: المادة", "الوحدة 6: الطاقة والقوى"],
            "السادس الابتدائي": ["الوحدة 1: الخلايا والوراثة", "الوحدة 2: عمليات الحياة", "الوحدة 3: الأنظمة البيئية ومواردها", "الوحدة 4: المادة والخصائص الكيميائية", "الوحدة 5: القوى والطاقة", "الوحدة 6: الكهرباء والمغناطيسية"]
        };

        const scienceNafesBank = [
            { q: "أي أجزاء النبات التالية يقوم بامتصاص الماء والأملاح المعدنية من التربة؟", options: ["أ) الأوراق", "ب) الجذور", "ج) الأزهار", "د) الساق"], correct: 1, domainName: "علوم الحياة" },
            { q: "ما الحالة التي تكون فيها جزيئات المادة متقاربة جداً ولها شكل ثابت؟", options: ["أ) الحالة الصلبة", "ب) الحالة السائلة", "ج) الحالة الغازية", "د) البلازما"], correct: 0, domainName: "العلوم الفيزيائية" },
            { q: "ما اسم العملية التي يحول فيها النبات ضوء الشمس إلى غذاء بعملية البناء الضوئي؟", options: ["أ) التنفس", "ب) البناء الضوئي", "ج) النتح", "د) الإخراج"], correct: 1, domainName: "علوم الحياة" },
            { q: "عند تقريب قطبين مغناطيسيين متشابهين (مثل شمالي مع شمالي)، فماذا يحدث؟", options: ["أ) يتجاذبان", "ب) يتنافران", "ج) لا تتأثر حركة المغناطيسين", "د) يندمجان معاً"], correct: 1, domainName: "العلوم الفيزيائية" },
            { q: "أي طبقات الأرض أو الصخور تعد الأنسب لنمو النباتات وتوفير الغذاء والدعم لها؟", options: ["أ) الطبقة الصخرية الصلبة", "ب) التربة السطحية الغنية بالدبال", "ج) الصخور النارية العميقة", "د) قاع المحيطات"], correct: 1, domainName: "علوم الأرض والفضاء" }
        ];

        function updateChaptersList() {
            const grade = document.getElementById('autoGradeSelect').value;
            const chapterSelect = document.getElementById('autoChapterSelect');
            chapterSelect.innerHTML = '';
            if(scienceCurriculumChapters[grade]) {
                scienceCurriculumChapters[grade].forEach(ch => {
                    const opt = document.createElement('option');
                    opt.value = ch;
                    opt.textContent = ch;
                    chapterSelect.appendChild(opt);
                });
            }
        }

        window.onload = function() { updateChaptersList(); };

        let currentStudentName = "";
        let activeQuestions = [];
        let currentQuestionIndex = 0;
        let studentScore = 0;

        function startInteractiveQuiz() {
            const nameInput = document.getElementById('studentExamName').value.trim();
            if(!nameInput) {
                alert('الرجاء كتابة اسم الطالب أولاً لبدء الاختبار.');
                return;
            }
            currentStudentName = nameInput;
            activeQuestions = [...scienceNafesBank];
            currentQuestionIndex = 0;
            studentScore = 0;

            document.getElementById('setupCard').style.display = 'none';
            document.getElementById('interactiveQuizCard').style.display = 'block';
            document.getElementById('studentDisplayBadge').textContent = `الطالب: ${currentStudentName}`;
            
            renderCurrentQuestion();
        }

        function renderCurrentQuestion() {
            const q = activeQuestions[currentQuestionIndex];
            document.getElementById('progressIndicator').textContent = `السؤال ${currentQuestionIndex + 1} من ${activeQuestions.length}`;
            
            const container = document.getElementById('singleQuestionContainer');
            let html = `
                <span class="badge-nafs">فرع العلوم: ${q.domainName}</span>
                <p class="font-bold my-3 text-base text-gray-900">${currentQuestionIndex + 1}. ${q.q}</p>
                <div class="options-grid">
            `;

            q.options.forEach((opt, idx) => {
                html += `
                    <label class="option-label">
                        <input type="radio" name="current_option" value="${idx}" onclick="showNextButton()">
                        <span>${opt}</span>
                    </label>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
            document.getElementById('nextQuestionBtn').style.display = 'none';
        }

        function showNextButton() {
            document.getElementById('nextQuestionBtn').style.display = 'block';
        }

        function handleNextQuestion() {
            const selectedRadio = document.querySelector('input[name="current_option"]:checked');
            if(!selectedRadio) {
                alert('الرجاء اختيار إجابة قبل الانتقال.');
                return;
            }

            const chosenValue = parseInt(selectedRadio.value);
            if(chosenValue === activeQuestions[currentQuestionIndex].correct) {
                studentScore++;
            }

            currentQuestionIndex++;
            if(currentQuestionIndex < activeQuestions.length) {
                renderCurrentQuestion();
            } else {
                showStudentResult();
            }
        }

        function showStudentResult() {
            document.getElementById('interactiveQuizCard').style.display = 'none';
            document.getElementById('resultCard').style.display = 'block';
            
            document.getElementById('studentResultName').textContent = `الطالب: ${currentStudentName}`;
            const total = activeQuestions.length;
            const percentage = Math.round((studentScore / total) * 100);
            
            document.getElementById('finalScoreText').textContent = `${studentScore} من ${total} (${percentage}%)`;
            
            let feedback = percentage >= 80 ? "🌟 ممتاز جداً! أداء متألق في مهارات مادة العلوم." :
                           percentage >= 50 ? "👍 مستوى جيد، ويحتاج إلى تعزيز بعض المفاهيم." :
                           "⚠️ يحتاج الطالب لمتابعة ودعم إضافي في منهج العلوم.";
            document.getElementById('feedbackText').textContent = feedback;
        }

        function resetForNextStudent() {
            document.getElementById('studentExamName').value = '';
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('setupCard').style.display = 'block';
        }
    </script>
</body>
</html>
